<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LATAnime – Streaming</title>
<style>
body {
    margin: 0;
    background: #07060b;
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
}
header {
    text-align: center;
    margin-bottom: 2rem;
}
h1 {
    color: #9d4edd;
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
}
.player-container {
    width: 100%;
    max-width: 800px;
    background: #12101e;
    border: 2px solid #9d4edd;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(157, 78, 221, 0.4);
}
video {
    width: 100%;
    display: block;
    aspect-ratio: 16/9;
    background: #000;
}
.info {
    padding: 1.5rem;
}
.info h2 {
    margin: 0 0 0.5rem 0;
    color: #00b4d8;
}
.info p {
    margin: 0;
    color: #94a3b8;
}
</style>
</head>
<body>

<header>
    <h1>LATAnime</h1>
    <p>Plataforma de streaming en línea</p>
</header>

<div class="player-container">
    <video controls autoplay>
        <source src="https://archive.org/download/nrt-01/NRT01.mp4" type="video/mp4">
        Tu navegador no soporta la reproducción de video.
    </video>
    <div class="info">
        <h2>Naruto - Episodio 1</h2>
        <p>¡Entra! ¡Naruto Uzumaki! Reproduciendo desde Archive.org.</p>
    </div>
</div>

</body>
</html>
