<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATAnime - Streaming Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07060b;
            --bg-surface: #12101e;
            --accent-purple: #9d4edd;
            --accent-blue: #00b4d8;
            --neon-glow: rgba(157, 78, 221, 0.4);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Profesional */
        header {
            background: rgba(7, 6, 11, 0.9);
            backdrop-filter: blur(12px);
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(157, 78, 221, 0.15);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .search-box {
            position: relative;
            width: 320px;
        }

        .search-box input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.8rem;
            border-radius: 25px;
            border: 1px solid rgba(157, 78, 221, 0.3);
            background: var(--bg-surface);
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.3);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Hero / Carrusel Dinámico de Presentación */
        .hero {
            position: relative;
            height: 500px;
            background-size: cover;
            background-position: center top;
            transition: background-image 0.8s ease-in-out;
            display: flex;
            align-items: flex-end;
            padding: 3rem 5%;
            border-bottom: 3px solid var(--accent-purple);
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(7,6,11,0.1) 0%, rgba(7,6,11,0.7) 60%, var(--bg-base) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 700px;
        }

        .hero-tag {
            background: rgba(157, 78, 221, 0.3);
            border: 1px solid var(--accent-purple);
            color: #e2b714;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 0.8rem;
        }

        .hero-title {
            font-size: 3.2rem;
            font-weight: 800;
            margin-bottom: 0.6rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .hero-desc {
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            line-height: 1.6;
            font-size: 1.1rem;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
        }

        .carousel-dots {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: 0.3s;
        }

        .dot.active {
            background: var(--accent-blue);
            box-shadow: 0 0 10px var(--accent-blue);
            width: 30px;
            border-radius: 5px;
        }

        /* Sección de Catálogo */
        .main-container {
            padding: 3rem 5%;
            flex: 1;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 5px;
            height: 24px;
            background: var(--accent-blue);
            border-radius: 2px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
        }

        .anime-card {
            background: var(--bg-surface);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .anime-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-purple);
            box-shadow: 0 12px 30px var(--neon-glow);
        }

        .card-img-container {
            width: 100%;
            height: 280px;
            overflow: hidden;
            position: relative;
        }

        .anime-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .anime-card:hover img {
            transform: scale(1.05);
        }

        .anime-info {
            padding: 1.2rem;
        }

        .anime-info h4 {
            font-size: 1.1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.4rem;
        }

        .anime-info span {
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        /* Modal Reproductor de Video */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 3, 7, 0.96);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--bg-surface);
            width: 100%;
            max-width: 950px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--accent-purple);
            box-shadow: 0 0 50px rgba(157, 78, 221, 0.3);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            z-index: 10;
            transition: 0.2s;
        }

        .close-btn:hover {
            color: var(--accent-blue);
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .video-container video, .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .episodes-list {
            padding: 1.8rem;
            max-height: 230px;
            overflow-y: auto;
        }

        .episodes-list h3 {
            margin-bottom: 1rem;
            color: var(--accent-blue);
            font-size: 1.2rem;
        }

        .ep-btn {
            background: #1e1936;
            color: #fff;
            border: 1px solid rgba(157, 78, 221, 0.3);
            padding: 0.7rem 1.2rem;
            margin: 0.4rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .ep-btn:hover, .ep-btn.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border-color: transparent;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.5);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="#" class="logo"><i class="fas fa-play-circle"></i> LATAnime</a>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Buscar anime...">
        </div>
    </header>

    <!-- Carrusel de Fondo Dinámico -->
    <div class="hero" id="heroBanner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="hero-tag" id="heroTag">★ Destacado</span>
            <h1 class="hero-title" id="heroTitle">Naruto</h1>
            <p class="hero-desc" id="heroDesc">Un joven ninja que busca el reconocimiento de su aldea y sueña con convertirse en el Hokage.</p>
            <div class="carousel-dots" id="carouselDots"></div>
        </div>
    </div>

    <!-- Catálogo -->
    <div class="main-container">
        <h2 class="section-title">Catálogo de Animes</h2>
        <div class="anime-grid" id="animeGrid"></div>
    </div>

    <!-- Modal Reproductor -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">×</span>
            <div class="video-container" id="videoContainer"></div>
            <div class="episodes-list" id="episodesList"></div>
        </div>
    </div>

    <script>
        // Carrusel optimizado con imágenes garantizadas
        const banners = [
            {
                title: "Naruto Uzumaki",
                desc: "Sigue la historia del ninja de la Aldea de la Hoja en su camino para convertirse en el shinobi más fuerte.",
                bg: "https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1600&auto=format&fit=crop"
            },
            {
                title: "Demon Slayer",
                desc: "Tanjiro Kamado lucha contra temibles demonios para vengar a su familia y curar a su hermana.",
                bg: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1600&auto=format&fit=crop"
            },
            {
                title: "Cyberpunk & Action",
                desc: "Explora mundos futuristas llenos de adrenalina, batallas épicas y misterios ocultos.",
                bg: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1600&auto=format&fit=crop"
            }
        ];

        let currentBanner = 0;
        
        function initDots() {
            const dotsContainer = document.getElementById('carouselDots');
            dotsContainer.innerHTML = '';
            banners.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dotsContainer.appendChild(dot);
            });
        }

        function rotateBanner() {
            const hero = document.getElementById('heroBanner');
            const title = document.getElementById('heroTitle');
            const desc = document.getElementById('heroDesc');
            const dots = document.querySelectorAll('.dot');

            hero.style.backgroundImage = `url('${banners[currentBanner].bg}')`;
            title.textContent = banners
