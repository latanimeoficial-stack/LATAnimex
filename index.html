<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LATAnimex – Streaming de Anime</title>
<meta name="description" content="LATAnimex: plataforma de streaming. Elige tus series y mira tus episodios.">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
:root{
  --ink:#07060b; --deep:#12101e; --sea:#0d2f7a; --volt:#9d4edd; --sky:#00b4d8; --ice:#eaf3ff;
  --text:#ffffff; --muted:#94a3b8; --line:rgba(157, 78, 221, 0.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

/* ---------- Carrusel Superior (Hero) ---------- */
.hero{position:relative;height:clamp(380px,54vh,580px);overflow:hidden;
  clip-path:polygon(0 0,100% 0,100% 90%,0 100%);background:var(--deep)}
.nav{position:absolute;z-index:5;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;
  padding:18px clamp(18px,4vw,56px);background:rgba(7,6,11,0.6);backdrop-filter:blur(8px)}
.logo{font-weight:900;font-style:italic;font-size:1.7rem;letter-spacing:-.04em;text-decoration:none;color:var(--text);display:flex;align-items:center;gap:6px}
.logo b{color:var(--volt);font-style:normal}
.mylist{background:rgba(18,16,30,.8);border:1px solid var(--line);border-radius:999px;padding:8px 16px;
  backdrop-filter:blur(6px);font-weight:600;text-decoration:none;color:var(--text)}

.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s;
  display:flex;align-items:center;padding:0 clamp(18px,6vw,96px);background-size:cover;background-position:center}
.slide.on{opacity:1;visibility:visible}
.slide::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(7,6,11,0.2) 0%, rgba(7,6,11,0.85) 75%, var(--ink) 100%), linear-gradient(90deg,rgba(7,6,11,0.95) 0%,rgba(7,6,11,0.3) 70%)}
.copy{position:relative;z-index:2;max-width:640px;margin-top:34px}
.copy h2{margin:0 0 10px;font-size:clamp(2.2rem,6vw,4.8rem);line-height:.95;font-weight:900;font-style:italic;letter-spacing:-.035em;
  text-shadow:0 4px 24px rgba(0,0,0,.6)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;padding:0;list-style:none}
.chips li{padding:3px 11px;border-radius:999px;background:rgba(234,243,255,.14);font-size:.85rem;font-weight:600}
.chips .rate{background:var(--volt)}
.copy p{margin:0 0 18px;max-width:46ch;color:#d6e4ff;text-shadow:1px 1px 3px rgba(0,0,0,0.8)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 22px;font-weight:800;text-decoration:none;cursor:pointer}
.btn.main{background:linear-gradient(135deg, var(--volt), var(--sky));color:#fff;box-shadow:0 8px 26px rgba(157,78,221,.45)}
.btn.main:hover{opacity:0.9}

.ctrl{position:absolute;z-index:5;left:clamp(18px,6vw,96px);right:clamp(18px,4vw,56px);bottom:11%;
  display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:8px}
.dots button{width:12px;height:12px;border-radius:99px;border:0;padding:0;background:rgba(234,243,255,.35);transition:width .3s,background .3s}
.dots button[aria-current="true"]{width:34px;background:var(--sky)}
.arrows{display:flex;gap:8px}
.arrows button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(5,13,36,.7);font-size:1.2rem;cursor:pointer}
.arrows button:hover{background:var(--volt)}

/* ---------- Catálogo Inferior (Grid) ---------- */
.catalog{padding:3rem clamp(18px,4vw,56px) 100px;flex:1;}
.head{margin:0 0 18px}
.head h1{margin:0;font-size:clamp(1.5rem,3vw,2.1rem);font-style:italic;font-weight:900;letter-spacing:-.03em}
.head p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{position:relative;aspect-ratio:2/3;border:0;padding:0;text-align:left;border-radius:12px;overflow:hidden;
  background-color:var(--deep);background-size:cover;background-position:center;
  box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .2s;cursor:pointer}
.card .art{position:absolute;inset:0;background:linear-gradient(165deg, transparent 40%, rgba(7,6,11,0.95))}
.card .info{position:absolute;inset:auto 0 0 0;padding:25px 12px 12px;background:linear-gradient(transparent,rgba(7,6,11,.95))}
.card strong{display:block;font-size:1rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:var(--muted)}
.card .star{position:absolute;top:10px;left:10px;padding:2px 9px;border-radius:99px;background:rgba(7,6,11,.8);font-size:.78rem;font-weight:700;z-index:2}
.card:hover{transform:translateY(-4px);border:1px solid var(--volt)}

/* ---------- Modal / Ventana Flotante ---------- */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(4, 3, 7, 0.94);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
    backdrop-filter: blur(8px);
}
.modal-content {
    background: var(--deep);
    width: 100%; max-width: 850px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--volt);
    box-shadow: 0 0 40px rgba(157, 78, 221, 0.4);
}
.close-btn {
    position: absolute;
    top: 15px; right: 20px;
    font-size: 2rem; color: #fff;
    cursor: pointer; z-index: 10;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}
.close-btn:hover { color: var(--sky); }
.video-container { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
.video-container video { width: 100%; height: 100%; border: none; }

.modal-body { padding: 1.5rem; }
.season-selector-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 10px;
}
.season-select {
    background: #1e1936;
    color: #fff;
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
}
.season-select option { background: #12101e; color: #fff; }
.episodes-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.ep-btn {
    background: #1e1936; color: #fff;
    border: 1px solid var(--line);
    padding: 12px 16px;
    border-radius: 8px; cursor: pointer;
    font-weight: 600; text-align: left; transition: 0.2s;
    display: flex; align-items: center; justify-content: space-between;
}
.ep-btn:hover, .ep-btn.active { background: var(--volt); border-color: var(--sky); }
.placeholder-box {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; background: radial-gradient(circle, #1a1633 0%, #07060b 100%);
    color: #fff; text-align: center; padding: 20px;
}
</style>
</head>
<body>

<header class="hero" aria-label="Anime destacados">
  <nav class="nav">
    <a class="logo" href="#"><i class="fas fa-play-circle" style="color:var(--volt)"></i>LAT<b>Animex</b></a>
    <a class="mylist" href="#catalogo">Catálogo</a>
  </nav>
  <div id="slides"></div>
  <div class="ctrl">
    <div class="dots" id="dots"></div>
    <div class="arrows">
      <button id="prev">‹</button>
      <button id="next">›</button>
    </div>
  </div>
</header>

<main class="catalog" id="catalogo">
  <div class="head">
    <h1>Catálogo de Animes</h1>
    <p>Haz clic en una serie para elegir temporada y capítulo.</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- Modal de Reproducción -->
<div class="modal" id="playerModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closePlayer()">×</span>
        <div class="video-container" id="videoContainer"></div>
        <div class="modal-body">
            <div class="season-selector-bar">
                <h3 id="modalTitle" style="margin:0; color:var(--sky);">Temporadas y Episodios</h3>
                <select class="season-select" id="seasonSelect" onchange="changeSeason(this.value)">
                    <!-- Las temporadas se cargan aquí -->
                </select>
            </div>
            <div class="episodes-list" id="episodesList">
                <!-- Los episodios se cargan aquí -->
            </div>
        </div>
    </div>
</div>

<script>
/* ============ BASE DE DATOS CON PORTADAS REALES Y OFICIALES ============ */
const ANIME = [
  {
    id: "naruto",
    t: "Naruto",
    g: "Shonen / Acción",
    y: 2002,
    r: "9.0",
    d: "Un joven ninja marginado busca el reconocimiento de su aldea y sueña con convertirse en Hokage.",
    img: "https://m.media-amazon.com/images/I/81x2859uKdL._AC_UF894,1000_QL80_.jpg",
    f: 1,
    seasons: [
      {
        name: "Temporada 1",
        episodes: [
          { title: "Episodio 1: ¡Entra! ¡Naruto Uzumaki!", videoUrl: "https://archive.org/download/nrt-01/NRT01.mp4" },
          { title: "Episodio 2: ¡Mi nombre es Konohamaru!", videoUrl: "" },
          { title: "Episodio 3: ¡Sasuke y Sakura: Amigos o enemigos!", videoUrl: "" }
        ]
      },
      {
        name: "Temporada 2",
        episodes: [
          { title: "Episodio 1: ¡Próximamente más episodios!", videoUrl: "" }
        ]
      }
    ]
  },
  {
    id: "demonslayer",
    t: "Demon Slayer",
    g: "Acción / Fantasía",
    y: 2019,
    r: "9.0",
    d: "Tanjiro Kamado emprende un peligroso viaje para vengar a su familia y curar a su hermana.",
    img: "https://m.media-amazon.com/images/M/MV5BZjZjNzI5MDctY2Y4YS00NmM4LTljMmItZTFkOTExNGI3ODRhXkEyXkFqcGdeQXVyNjc3MjQzNTI@._V1_FMjpg_UX1000_.jpg",
    f: 1,
    seasons: [
      {
        name: "Temporada 1 (Kimetsu no Yaiba)",
        episodes: [
          { title: "Episodio 1: Crueldad", videoUrl: "" }
        ]
      }
    ]
  },
  {
    id: "jujutsu",
    t: "Jujutsu Kaisen",
    g: "Sobrenatural",
    y: 2020,
    r: "8.8",
    d: "Un estudiante de preparatoria se traga un objeto maldito y se une a una organización secreta de hechiceros.",
    img: "https://m.media-amazon.com/images/M/MV5BNGY4MTg3NzgtOWFkZi00YzVmLThmZjAtYzNmYjBmMDc0MWFjXkEyXkFqcGdeQXVyNjAwNDUxODI@._V1_FMjpg_UX1000_.jpg",
    f: 1,
    seasons: [
      {
        name: "Temporada 1",
        episodes: [
          { title: "Episodio 1: Ryomen Sukuna", videoUrl: "" }
        ]
      }
    ]
  },
  {
    id: "onepiece",
    t: "One Piece",
    g: "Aventura",
    y: 1999,
    r: "9.1",
    d: "Monkey D. Luffy zarpa con su tripulación pirata para encontrar el legendario tesoro One Piece.",
    img: "https://m.media-amazon.com/images/M/MV5BODcwNWE3OTMtMDc3MS00NDFjLWE1OTAtNDAxNzYyOWIwMmUwXkEyXkFqcGdeQXVyNTAyODkwOQ@@._V1_FMjpg_UX1000_.jpg",
    f: 0,
    seasons: [
      {
        name: "East Blue (Temporada 1)",
        episodes: [
          { title: "Episodio 1: ¡Soy Luffy! ¡El hombre que será el Rey de los Piratas!", videoUrl: "" }
        ]
      }
    ]
  },
  {
    id: "attack",
    t: "Attack on Titan",
    g: "Drama / Acción",
    y: 2013,
    r: "9.1",
    d: "La humanidad vive protegida por enormes murallas para defenderse de mortales titanes devoradores de hombres.",
    img: "https://m.media-amazon.com/images/M/MV5BNDFjYTIxMjctYTQwZC00ZDliLThjZDktODJlNTQ3ZGJjN2RjXkEyXkFqcGdeQXVyNTI4MzE4MDU@._V1_FMjpg_UX1000_.jpg",
    f: 0,
    seasons: [
      {
        name: "Temporada 1",
        episodes: [
          { title: "Episodio 1: Para ti, en 2000 años", videoUrl: "" }
        ]
      }
    ]
  },
  {
    id: "sololeveling",
    t: "Solo Leveling",
    g: "Acción",
    y: 2024,
    r: "8.5",
    d: "En un mundo lleno de portales y monstruos, el cazador más débil recibe un sistema secreto para subir de nivel.",
    img: "https://m.media-amazon.com/images/M/MV5BNGE2NmQ4ZjgtNTM5ZS00NWVjLWIyMGItMTBjN2NlZTRhMmQ1XkEyXkFqcGdeQXVyMTUzMTg2ODkz._V1_FMjpg_UX1000_.jpg",
    f: 0,
    seasons: [
      {
        name: "Temporada 1",
        episodes: [
          { title: "Episodio 1: Me he acostumbrado", videoUrl: "" }
        ]
      }
    ]
  }
];

const $ = (s) => document.querySelector(s);
const byId = (id) => ANIME.find((x) => x.id === id);
let currentAnime = null;
let activeEpIndex = -1;

/* ---------- Carrusel Superior Automático ---------- */
const feat = ANIME.filter((x) => x.f);
$("#slides").innerHTML = feat.map((x, i) => `
  <section class="slide${i ? "" : " on"}" style="background-image: url('${x.img}')" aria-label="${x.t}">
    <div class="copy">
      <span class="chips"><li class="rate">★ ${x.r}</li><li>${x.g}</li><li>${x.y}</li></span>
      <h2>${x.t}</h2>
      <p>${x.d}</p>
      <div class="btns">
        <button class="btn main" onclick="openPlayer('${x.id}')"><i class="fas fa-list"></i> Ver Episodios</button>
      </div>
    </div>
  </section>`).join("");

$("#dots").innerHTML = feat.map((x, i) => `<button aria-label="Ir a ${x.t}" ${i ? "" : 'aria-current="true"'}></button>`).join("");

const slides = [...document.querySelectorAll(".slide")];
const dots = [...document.querySelectorAll("#dots button")];
let cur = 0, timer;
const go = (n) => {
  cur = (n + slides.length) % slides.length;
  slides.forEach((s, i) => s.classList.toggle("on", i === cur));
  dots.forEach((d, i) => d.setAttribute("aria-current", i === cur));
};
const play = () => {
  clearInterval(timer);
  timer = setInterval(() => go(cur + 1), 6000);
};
$("#prev").onclick = () => { go(cur - 1); play(); };
$("#next").onclick = () => { go(cur + 1); play(); };
dots.forEach((d, i) => (d.onclick = () => { go(i); play(); }));
play();

/* ---------- Renderizar Tarjetas con Portadas Oficiales ---------- */
$("#grid").innerHTML = ANIME.map((x) => `
  <div class="card" onclick="openPlayer('${x.id}')" style="background-image:url('${x.img}')">
    <div class="art"></div>
    <span class="star">★ ${x.r}</span>
    <div class="info">
      <strong>${x.t}</strong>
      <small>${x.g} • ${x.y}</small>
    </div>
  </div>`).join("");

/* ---------- Lógica del Modal y Selección de Episodios ---------- */
function openPlayer(id) {
    currentAnime = byId(id);
    const modal = document.getElementById('playerModal');
    const select = document.getElementById('seasonSelect');
    
    document.getElementById('modalTitle').textContent = currentAnime.t;

    // Colocar el aviso inicial en el contenedor sin reproducir automáticamente
    showPlaceholder();

    // Llenar selector de temporadas
    select.innerHTML = currentAnime.seasons.map((season, index) => `
        <option value="${index}">${season.name}</option>
    `).join("");

    changeSeason(0);
    modal.style.display = 'flex';
}

function showPlaceholder() {
    document.getElementById('videoContainer').innerHTML = `
        <div class="placeholder-box">
            <i class="fas fa-play-circle" style="font-size:3.5rem; color:var(--volt); margin-bottom:12px;"></i>
            <h3 style="margin:0 0 6px 0;">${currentAnime.t}</h3>
            <p style="color:var(--muted); margin:0;">Selecciona un episodio de la lista inferior para empezar a reproducir.</p>
        </div>
    `;
}

function changeSeason(seasonIndex) {
    const season = currentAnime.seasons[seasonIndex];
    const epList = document.getElementById('episodesList');
    activeEpIndex = -1;

    epList.innerHTML = season.episodes.map((ep, index) => `
        <button class="ep-btn" id="ep-btn-${index}" onclick="playEpisode('${ep.videoUrl}', '${ep.title}', ${index})">
            <span><i class="fas fa-film" style="color:var(--sky); margin-right:10px;"></i> ${ep.title}</span>
            <i class="fas fa-play" style="font-size:0.8rem; opacity:0.7;"></i>
        </button>
    `).join("");
}

function playEpisode(url, title, index) {
    const container = document.getElementById('videoContainer');
    
    // Marcar botón activo
    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
    const currentBtn = document.getElementById(`ep-btn-${index}`);
    if(currentBtn) currentBtn.classList.add('active');

    if(url) {
        container.innerHTML = `<video controls autoplay><source src="${url}" type="video/mp4">Tu navegador no soporta el video.</video>`;
    } else {
        container.innerHTML = `
            <div class="placeholder-box">
                <i class="fas fa-clock" style="font-size:3rem; color:var(--sky); margin-bottom:12px;"></i>
                <h3 style="margin:0 0 6px 0;">${title}</h3>
                <p style="color:var(--muted); margin:0;">Este capítulo aún no está subido a los servidores de LATAnimex.</p>
            </div>
        `;
    }
}

function closePlayer() {
    document.getElementById('playerModal').style.display = 'none';
    document.getElementById('videoContainer').innerHTML = '';
}
</script>
</body>
</html>
