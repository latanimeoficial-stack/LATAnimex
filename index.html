<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LATAnime – Streaming de Anime</title>
<meta name="description" content="LATAnime: plataforma de streaming de anime en línea.">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
:root{
  --ink:#050508; --deep:#100d1a; --volt:#9d4edd; --sky:#00b4d8; --text:#ffffff; --muted:#94a3b8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

/* ---------- Carrusel Superior ---------- */
.hero{position:relative;height:clamp(380px,52vh,540px);overflow:hidden;background:var(--deep)}
.nav{position:absolute;z-index:5;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;
  padding:18px clamp(18px,4vw,56px);background:rgba(5,5,8,0.7);backdrop-filter:blur(8px)}
.logo{font-weight:900;font-style:italic;font-size:1.7rem;text-decoration:none;color:var(--text);display:flex;align-items:center;gap:6px}
.logo b{color:var(--volt)}
.mylist{background:rgba(16,13,26,.9);border:1px solid rgba(157,78,221,0.3);border-radius:999px;padding:8px 16px;font-weight:600;text-decoration:none;color:var(--text)}

.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s ease;
  display:flex;align-items:center;padding:0 clamp(18px,6vw,96px);background-size:cover;background-position:center}
.slide.on{opacity:1;visibility:visible}
/* Sombra optimizada: más compacta para no tapar los personajes de fondo */
.slide::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,8,0.95) 15%,rgba(5,5,8,0.6) 45%,rgba(5,5,8,0.1) 75%)}
.copy{position:relative;z-index:2;max-width:550px}
.copy h2{margin:0 0 10px;font-size:clamp(2.2rem,5vw,4rem);font-weight:900;font-style:italic;text-shadow:0 4px 20px rgba(0,0,0,.8)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;padding:0;list-style:none}
.chips li{padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.15);font-size:.85rem;font-weight:600}
.chips .rate{background:var(--volt)}
.copy p{margin:0 0 18px;color:#d6e4ff;text-shadow:0 2px 10px rgba(0,0,0,0.8)}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:800;background:linear-gradient(135deg, var(--volt), var(--sky));color:#fff;cursor:pointer;box-shadow:0 5px 20px rgba(157,78,221,0.4)}

.ctrl{position:absolute;z-index:5;left:clamp(18px,6vw,96px);right:clamp(18px,4vw,56px);bottom:8%}
.dots{display:flex;gap:8px}
.dots button{width:12px;height:12px;border-radius:99px;border:0;background:rgba(255,255,255,.3);transition:all .3s}
.dots button[aria-current="true"]{width:32px;background:var(--sky)}

/* ---------- Catálogo Grid ---------- */
.catalog{padding:3rem clamp(18px,4vw,56px) 100px;flex:1}
.head h1{margin:0 0 5px;font-size:2rem;font-style:italic;font-weight:900}
.head p{margin:0 0 20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}

.card{
  position:relative;aspect-ratio:2/3;border:0;padding:0;text-align:left;border-radius:14px;overflow:hidden;
  background-size:cover;background-position:center;background-color:var(--deep);
  box-shadow:0 10px 25px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s;cursor:pointer;
  border:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;justify-content:flex-end;
}
.card .art{position:absolute;inset:0;background:linear-gradient(180deg, transparent 50%, rgba(5,5,8,0.9) 100%)}
.card:hover{transform:translateY(-6px);box-shadow:0 0 30px rgba(157,78,221,0.6)}
.card .star{position:absolute;top:10px;left:10px;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,0.8);font-size:.75rem;font-weight:700;z-index:2}
.card .card-info{position:relative;z-index:2;padding:12px;width:100%}
.card .card-info strong{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .card-info small{color:var(--muted);font-size:0.8rem}

/* ---------- Modal Estilo Netflix ---------- */
.modal {
    display: none; position: fixed; inset: 0; background: rgba(3,2,6,0.95);
    z-index: 100; justify-content: center; align-items: center; padding: 1.5rem; backdrop-filter: blur(10px);
}
.modal-content {
    background: var(--deep); width: 100%; max-width: 900px; max-height: 90vh;
    border-radius: 16px; overflow-y: auto; position: relative; border: 1px solid var(--volt);
    box-shadow: 0 0 50px rgba(157, 78, 221, 0.4);
}
.close-btn { position: absolute; top: 15px; right: 20px; font-size: 2rem; color: #fff; cursor: pointer; z-index: 20; }
.close-btn:hover { color: var(--sky); }

.anime-detail-header { display: flex; gap: 24px; padding: 2.5rem 2rem 2rem 2rem; flex-wrap: wrap; align-items: flex-start; }
.anime-poster-img {
    width: 200px; aspect-ratio: 2/3; object-fit: cover; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 10px 25px rgba(0,0,0,0.7); flex-shrink: 0;
}
.anime-info-text { flex: 1; min-width: 250px; }
.anime-info-text h3 { margin: 0 0 8px 0; font-size: 2.2rem; font-style: italic; }
.anime-info-text .meta { display: flex; gap: 10px; color: var(--sky); font-weight: 700; margin-bottom: 12px; font-size: 0.9rem; }
.anime-info-text p { color: #d6e4ff; margin: 0; line-height: 1.6; }

.episodes-section { padding: 0 2rem 2.5rem 2rem; }
.season-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem; }
.season-select { background: #1e1936; color: #fff; border: 1px solid rgba(157,78,221,0.4); padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
.ep-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.5rem; }
.ep-btn { background: #1e1936; color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: left; display: flex; justify-content: space-between; transition: 0.2s; }
.ep-btn:hover, .ep-btn.active { background: var(--volt); border-color: var(--sky); }

.video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
.video-box video { width: 100%; height: 100%; border: none; }
.placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: #0b0914; color: var(--muted); text-align: center; padding: 20px; }
</style>
</head>
<body>

<header class="hero">
  <nav class="nav">
    <a class="logo" href="#"><i class="fas fa-play-circle" style="color:var(--volt)"></i>LAT<b>Anime</b></a>
    <a class="mylist" href="#catalogo">Catálogo</a>
  </nav>
  <div id="slides"></div>
  <div class="ctrl">
    <div class="dots" id="dots"></div>
  </div>
</header>

<main class="catalog" id="catalogo">
  <div class="head">
    <h1>Catálogo de Animes</h1>
    <p>Haz clic en cualquier serie para ver su sinopsis y elegir capítulos.</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">×</span>
        <div class="anime-detail-header" id="modalHeader"></div>
        <div class="episodes-section">
            <div class="season-bar">
                <h3 style="margin:0; color:var(--sky)">Episodios</h3>
                <select class="season-select" id="seasonSelect" onchange="changeSeason(this.value)"></select>
            </div>
            <div class="ep-list" id="epList"></div>
            <div class="video-box" id="videoBox">
                <div class="placeholder">
                    <i class="fas fa-film" style="font-size:2.5rem; color:var(--volt); margin-bottom:10px;"></i>
                    <p style="margin:0">Selecciona un capítulo de la lista superior para reproducir.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const ANIME = [
  {
    id: "naruto", t: "Naruto", g: "Shonen / Acción", y: 2002, r: "9.0",
    d: "Un joven ninja marginado de la Aldea Oculta de la Hoja busca el reconocimiento de todos y sueña con convertirse en Hokage, enfrentando grandes pruebas y batallas intensas.",
    img: "naruto.jpg",
    banner: "thumb-1920-647549.jpg",
    f: true,
    seasons: [
      { name: "Temporada 1", episodes: [
        { title: "Episodio 1: ¡Entra! ¡Naruto Uzumaki!", url: "https://archive.org/download/nrt-01/NRT01.mp4" },
        { title: "Episodio 2: ¡Mi nombre es Konohamaru!", url: "" }
      ]}
    ]
  },
  {
    id: "demonslayer", t: "Demon Slayer", g: "Acción / Fantasía", y: 2019, r: "9.0",
    d: "Tanjiro Kamado emprende un peligroso viaje para vengar a su familia masacrada por un demonio y curar a su hermana Nezuko.",
    img: "demonslayerr.jpg",
    banner: "thumb-1920-1320541.png",
    f: true,
    seasons: [
      { name: "Temporada 1", episodes: [{ title: "Episodio 1: Crueldad", url: "" }] }
    ]
  },
  {
    id: "jujutsu", t: "Jujutsu Kaisen", g: "Sobrenatural", y: 2020, r: "8.8",
    d: "Yuji Itadori se une a una organización secreta de hechiceros tras ingerir un objeto maldito de categoría especial.",
    img: "jujutsu.webp",
    banner: "wp4242704.jpg",
    f: true,
    seasons: [
      { name: "Temporada 1", episodes: [{ title: "Episodio 1: Ryomen Sukuna", url: "" }] }
    ]
  },
  {
    id: "onepiece", t: "One Piece", g: "Aventura", y: 1999, r: "9.1",
    d: "Monkey D. Luffy zarpa con su tripulación en busca del legendario tesoro dejado por el Rey de los Piratas.",
    img: "onepiece.webp",
    banner: "thumb-1920-833315.jpg",
    f: true,
    seasons: [
      { name: "East Blue", episodes: [{ title: "Episodio 1: ¡Soy Luffy!", url: "" }] }
    ]
  },
  {
    id: "attack", t: "Attack on Titan", g: "Drama / Acción", y: 2013, r: "9.1",
    d: "La humanidad sobrevive confinada tras enormes murallas para protegerse de gigantescos titanes devoradores de hombres.",
    img: "atakto.webp",
    banner: "thumb-1920-1001038.jpg",
    f: true,
    seasons: [
      { name: "Temporada 1", episodes: [{ title: "Episodio 1: Para ti, en 2000 años", url: "" }] }
    ]
  }
];

const $ = s => document.querySelector(s);
let currentAnime = null;

// Carrusel (Usa la propiedad .banner)
const feat = ANIME.filter(x => x.f);
$("#slides").innerHTML = feat.map((x, i) => `
  <section class="slide${i ? "" : " on"}" style="background-image: url('${x.banner}')">
    <div class="copy">
      <ul class="chips"><li class="rate">★ ${x.r}</li><li>${x.g}</li><li>${x.y}</li></ul>
      <h2>${x.t}</h2>
      <p>${x.d}</p>
      <button class="btn" onclick="openModal('${x.id}')"><i class="fas fa-play"></i> Ver Episodios</button>
    </div>
  </section>`).join("");

$("#dots").innerHTML = feat.map((_, i) => `<button ${i ? "" : 'aria-current="true"'}></button>`).join("");

const slides = [...document.querySelectorAll(".slide")];
const dots = [...document.querySelectorAll(".dots button")];
let cur = 0, timer;
const go = n => {
  cur = (n + slides.length) % slides.length;
  slides.forEach((s, i) => s.classList.toggle("on", i === cur));
  dots.forEach((d, i) => d.setAttribute("aria-current", i === cur));
};
// Carrusel ágil cada 4 segundos
timer = setInterval(() => go(cur + 1), 4000);
dots.forEach((d, i) => d.onclick = () => { go(i); clearInterval(timer); });

// Catálogo Grid (Usa la propiedad .img vertical)
$("#grid").innerHTML = ANIME.map(x => `
  <div class="card" onclick="openModal('${x.id}')" style="background-image: url('${x.img}')">
    <div class="art"></div>
    <span class="star">★ ${x.r}</span>
    <div class="card-info">
      <strong>${x.t}</strong>
      <small>${x.g} • ${x.y}</small>
    </div>
  </div>`).join("");

function openModal(id) {
    currentAnime = ANIME.find(x => x.id === id);
    $("#modalHeader").innerHTML = `
        <img class="anime-poster-img" src="${currentAnime.img}" alt="${currentAnime.t}">
        <div class="anime-info-text">
            <h3>${currentAnime.t}</h3>
            <div class="meta"><span>★ ${currentAnime.r}</span><span>•</span><span>${currentAnime.g}</span><span>•</span><span>${currentAnime.y}</span></div>
            <p>${currentAnime.d}</p>
        </div>
    `;
    resetVideo();
    $("#seasonSelect").innerHTML = currentAnime.seasons.map((s, i) => `<option value="${i}">${s.name}</option>`).join("");
    changeSeason(0);
    $("#modal").style.display = "flex";
}

function changeSeason(idx) {
    const s = currentAnime.seasons[idx];
    $("#epList").innerHTML = s.episodes.map((ep, i) => `
        <button class="ep-btn" id="ep-${i}" onclick="playEp('${ep.url}', '${ep.title}', ${i})">
            <span><i class="fas fa-play-circle" style="color:var(--sky); margin-right:8px"></i>${ep.title}</span>
            <span style="font-size:0.8rem; opacity:0.7">Reproducir</span>
        </button>`).join("");
}

function playEp(url, title, idx) {
    document.querySelectorAll(".ep-btn").forEach(b => b.classList.remove("active"));
    const btn = document.getElementById(`ep-${idx}`);
    if(btn) btn.classList.add("active");

    const box = $("#videoBox");
    if(url) {
        box.innerHTML = `<video controls autoplay><source src="${url}" type="video/mp4"></video>`;
    } else {
        box.innerHTML = `
            <div class="placeholder">
                <i class="fas fa-clock" style="font-size:2.5rem; color:var(--sky); margin-bottom:10px;"></i>
                <h4 style="margin:0 0 5px 0; color:#fff">${title}</h4>
                <p style="margin:0; font-size:0.9rem">Próximamente disponible en los servidores.</p>
            </div>`;
    }
}

function resetVideo() {
    $("#videoBox").innerHTML = `
        <div class="placeholder">
            <i class="fas fa-film" style="font-size:2.5rem; color:var(--volt); margin-bottom:10px;"></i>
            <p style="margin:0">Selecciona un capítulo de la lista superior para reproducir.</p>
        </div>`;
}

function closeModal() {
    $("#modal").style.display = "none";
    $("#videoBox").innerHTML = "";
}
</script>
</body>
</html>
